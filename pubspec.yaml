name: softstore_buyer_app
description: "Softstore buyer app — browse products and place orders"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Images
  cached_network_image: ^3.4.1

  # JSON serialization
  json_annotation: ^4.9.0

  # Connectivity
  connectivity_plus: ^6.1.1

  # Auth
  google_sign_in: ^6.2.2

  # Push notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # reCAPTCHA
  recaptcha_enterprise_flutter: ^18.7.0

  # Utilities
  url_launcher: ^6.3.1
  share_plus: ^12.0.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
