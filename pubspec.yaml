name: softstore_buyer_app
description: "Discover products from registered stores across Pakistan on SoftStore Marketplace. Cash on delivery nationwide."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.0

  # Networking (F16-F19)
  dio: ^5.3.1
  cookie_jar: ^4.0.7
  dio_cookie_manager: ^3.0.0
  html: ^0.15.4

  # Storage (F22-F24)
  shared_preferences: ^2.3.5
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.5
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.1
  # Push Notifications & Announcements
  onesignal_flutter: ^5.6.8
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.0
  webview_flutter_wkwebview: ^3.26.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.6
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/logo/logo-launcher-full.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "images/logo/logo-launcher-foreground.png"

flutter:
  uses-material-design: true
  assets:
    - images/logo/
    - assets/images/
